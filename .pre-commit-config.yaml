# Pre-commit hooks per formattazione automatica
# Installazione: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--exclude, "venv|node_modules|tests|cercollettiva/settings"]
  
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile, black, --multi-line-output, "3"]
  
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503,E501]
        additional_dependencies: [flake8-docstrings]
  
  - repo: local
    hooks:
      - id: django-check
        name: Django checks
        entry: python manage.py check
        language: system
        files: \.py$
        pass_filenames: false
