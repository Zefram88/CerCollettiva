# Bootstrap HTTP-only config to serve ACME challenges on first start
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /health/ {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}


