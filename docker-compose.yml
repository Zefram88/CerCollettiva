services:
  # Secrets initializer (generates passwords/keys at first run)
  secrets-init:
    image: python:3.11-alpine
    container_name: cercollettiva_secrets_init
    command: >
      python -c "import os,base64,secrets; d='/secrets'; os.makedirs(d, exist_ok=True); rp=f'{d}/redis_password';\
      \nimport os as _os;\
      \nimport pathlib;\
      \nfrom os.path import exists as ex;\
      \nimport sys;\
      \nimport io;\
      \nimport builtins;\
      \n\
      \nimport os,base64,secrets;\
      \n# redis password\
      \nif not ex(rp):\
      \n    open(rp,'w').write(base64.urlsafe_b64encode(secrets.token_bytes(24)).decode().rstrip('='));\
      \nae=f'{d}/app.env';\
      \n# app env\
      \nif not ex(ae):\
      \n    sk=base64.urlsafe_b64encode(secrets.token_bytes(50)).decode().rstrip('=');\
      \n    fk=base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip('=');\
      \n    open(ae,'w').write('SECRET_KEY='+sk+'\nFIELD_ENCRYPTION_KEY='+fk+'\n');\
      \nprint('secrets ready')"
    volumes:
      - secrets_data:/secrets
    networks:
      - cercollettiva_network
    restart: "no"
  # Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: cercollettiva_db
    environment:
      POSTGRES_DB: cercollettiva
      POSTGRES_USER: cercollettiva_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cercollettiva_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - cercollettiva_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cercollettiva_user -d cercollettiva"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cercollettiva_redis
    command: sh -c "redis-server --appendonly yes --requirepass $(cat /secrets/redis_password)"
    volumes:
      - redis_data:/data
      - secrets_data:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    ports:
      - "6379:6379"
    networks:
      - cercollettiva_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: cercollettiva_mqtt
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/mosquitto/passwd:/mosquitto/config/passwd
      - mqtt_data:/mosquitto/data
      - mqtt_logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - cercollettiva_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "test", "-m", "test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cercollettiva_web
    environment:
      # Configurazione flessibile - controllata da variabili d'ambiente
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-cercollettiva.settings.production}
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_NAME=cercollettiva
      - DB_USER=cercollettiva_user
      - DB_PASSWORD=${DB_PASSWORD:-cercollettiva_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-mqtt_user}
      - MQTT_PASS=${MQTT_PASS:-mqtt_pass}
    volumes:
      # Condizionale: bind mount codice SOLO in modalità dev per auto-reload
      # In produzione: codice è dentro l'immagine (più sicuro e performante)
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
      - setup_complete:/app/.setup_complete  # Persist setup state
      - secrets_data:/secrets:ro
    ports:
      - "8000:8000"
    networks:
      - cercollettiva_network
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/monitoring/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Give time for setup

  # Nginx Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: cercollettiva_nginx
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./staticfiles:/var/www/static
      - ./media:/var/www/media
      - ./config/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Configurazione flessibile - controllata da variabili d'ambiente
      - NGINX_ENV=${NGINX_ENV:-prod}
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    networks:
      - cercollettiva_network
    depends_on:
      - web
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery services commented out - not currently used
  # Uncomment when implementing async tasks
