  #     - db
  #     - redis
  #   restart: unless-stopped
  #
  # # Celery Beat (per task schedulati)
  # celery-beat:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: cercollettiva_celery_beat
  #   command: celery -A cercollettiva beat -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
  #     - SECRET_KEY=${SECRET_KEY}
  #     - DB_NAME=cercollettiva
  #     - DB_USER=cercollettiva_user
  #     - DB_PASSWORD=${DB_PASSWORD:-cercollettiva_pass}
  #     - DB_HOST=db
  #     - DB_PORT=5432
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
  #   volumes:
  #     - ./logs:/app/logs
  #   networks:
  #     - cercollettiva_network
  #   depends_on:
  #     - db
  #     - redis
  #   restart: unless-stopped
  #
  # # Flower (monitoring Celery)
  # flower:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: cercollettiva_flower
  #   command: celery -A cercollettiva flower --port=5555
  #   environment:
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
  #   ports:
  #     - "5555:5555"
  #   networks:
  #     - cercollettiva_network
  #   depends_on:
  #     - redis
  #   restart: unless-stopped

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: cercollettiva_prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cercollettiva_network
    restart: unless-stopped

  # Backup automatico
  backup:
    image: postgres:15
    container_name: cercollettiva_backup
    environment:
      - PGPASSWORD=${DB_PASSWORD:-cercollettiva_pass}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - ./media:/media:ro
      - ./.env:/.env:ro
    command: >
      sh -c "
        chmod +x /backup.sh &&
        echo '0 2 * * * /backup.sh' | crontab - &&
        crond -f
      "
    depends_on:
      - db
    networks:
      - cercollettiva_network
    restart: unless-stopped
    profiles:
      - backup
    # condition: ${ENABLE_BACKUP:-false}  # Non supportato in questa versione

  # Restore backup
  restore:
    image: postgres:15
    container_name: cercollettiva_restore
    environment:
      - PGPASSWORD=${DB_PASSWORD:-cercollettiva_pass}
      - DB_HOST=${DB_HOST:-db}
      - DB_NAME=${DB_NAME:-cercollettiva}
      - DB_USER=${DB_USER:-cercollettiva_user}
    volumes:
      - ./scripts/restore-docker.sh:/restore.sh:ro
      - ./backups:/backups
      - ./media:/media
      - ./.env:/.env:ro
    command: >
      sh -c "
        chmod +x /restore.sh &&
        echo 'Restore container pronto. Usa: docker exec cercollettiva_restore /restore.sh <backup_file>'
        tail -f /dev/null
      "
    depends_on:
      - db
    networks:
      - cercollettiva_network
    profiles:
      - restore

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: cercollettiva_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - cercollettiva_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mqtt_data:
    driver: local
  mqtt_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  setup_complete:
    driver: local
  secrets_data:
    driver: local

networks:
  cercollettiva_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
