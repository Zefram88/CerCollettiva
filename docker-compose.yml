  # celery:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: cercollettiva_celery
  #   command: celery -A cercollettiva worker -l info
  #   environment:
  #     - DEBUG=${DEBUG:-False}
