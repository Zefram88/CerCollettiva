services:
  redis:
    command: sh -c "redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --raw ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Override inherited mounts and dependencies for CI (no secrets-init)
    volumes: []
    depends_on: {}

  web:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
    # Remove secrets-init dependency; keep core services only
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    # Remove /secrets mount inherited from base compose
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
      - setup_complete:/app/.setup_complete


