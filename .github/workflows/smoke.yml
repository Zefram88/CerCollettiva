name: Smoke Matrix

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod-local-https, prod-webonly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images
        run: docker compose build

      - name: Prepare self-signed certs (prod-local-https)
        if: matrix.mode == 'prod-local-https'
        run: |
          mkdir -p config/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout config/ssl/key.pem -out config/ssl/cert.pem \
            -subj "/CN=localhost"

      - name: Bring up stack (dev)
        if: matrix.mode == 'dev'
        env:
          RUN_MODE: dev
        run: docker compose up -d

      - name: Bring up stack (prod-local-https)
        if: matrix.mode == 'prod-local-https'
        env:
          RUN_MODE: prod-local-https
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: docker compose up -d

      - name: Bring up stack (prod-webonly)
        if: matrix.mode == 'prod-webonly'
        env:
          RUN_MODE: prod
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: docker compose up -d db redis mqtt web

      - name: Wait for health (dev via HTTP)
        if: matrix.mode == 'dev'
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs nginx web || true; exit 1

      - name: Wait for health (prod-local-https via HTTPS)
        if: matrix.mode == 'prod-local-https'
        run: |
          for i in {1..45}; do
            if curl -kfsS https://localhost/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs nginx web || true; exit 1

      - name: Wait for health (prod-webonly web:8000)
        if: matrix.mode == 'prod-webonly'
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:8000/monitoring/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs web || true; exit 1

      - name: Teardown
        if: always()
        run: docker compose down -v || true


