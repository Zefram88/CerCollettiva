name: Smoke Matrix

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod-local-https, prod-webonly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build images
        run: docker compose build

      - name: Prepare self-signed certs (prod-local-https)
        if: matrix.mode == 'prod-local-https'
        run: |
          mkdir -p config/ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout config/ssl/key.pem -out config/ssl/cert.pem \
            -subj "/CN=localhost"

      - name: Bring up stack (dev)
        if: matrix.mode == 'dev'
        env:
          RUN_MODE: dev
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          NGINX_ENV: dev
        run: |
          set -e
          docker compose up -d || {
            echo "compose up failed - dumping diagnostics";
            docker compose ps || true;
            docker compose logs db redis mqtt web nginx || true;
            exit 1;
          }

      - name: Bring up stack (prod-local-https)
        if: matrix.mode == 'prod-local-https'
        env:
          RUN_MODE: prod-local-https
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          NGINX_ENV: prod
        run: |
          set -e
          docker compose up -d || {
            echo "compose up failed - dumping diagnostics";
            docker compose ps || true;
            docker compose logs db redis mqtt web nginx || true;
            exit 1;
          }

      - name: Bring up stack (prod-webonly)
        if: matrix.mode == 'prod-webonly'
        env:
          RUN_MODE: prod
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          set -e
          docker compose up -d db redis mqtt web || {
            echo "compose up failed - dumping diagnostics";
            docker compose ps || true;
            docker compose logs db redis mqtt web || true;
            exit 1;
          }

      - name: Wait for health (dev via HTTP)
        if: matrix.mode == 'dev'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs nginx web || true; exit 1

      - name: Probe endpoints (dev)
        if: matrix.mode == 'dev'
        run: |
          set -e
          BASE_URL="http://localhost"
          # Aggregated status (accept 200/207)
          STATUS_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/status/?detailed=true")
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "207" ]]; then
            echo "Status check failed: $STATUS_CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
          fi
          # Service health (accept 200/207)
          for SVC in database cache mqtt; do
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/health/$SVC/")
            if [[ "$CODE" != "200" && "$CODE" != "207" ]]; then
              echo "Health $SVC failed: $CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
            fi
          done
          # Metrics contains a known system metric
          curl -fsS "$BASE_URL/monitoring/metrics/" | grep -q "system_cpu_usage_percent" || { echo "Metrics probe failed"; docker compose ps; docker compose logs nginx web || true; exit 1; }
          # Static asset served (admin CSS)
          STATIC_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/static/admin/css/base.css")
          if [[ "$STATIC_CODE" != "200" ]]; then
            echo "Static probe failed: $STATIC_CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
          fi

      - name: Wait for health (prod-local-https via HTTPS)
        if: matrix.mode == 'prod-local-https'
        run: |
          for i in {1..60}; do
            if curl -kfsS https://localhost/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs nginx web || true; exit 1

      - name: Probe endpoints (prod-local-https)
        if: matrix.mode == 'prod-local-https'
        run: |
          set -e
          BASE_URL="https://localhost"
          # Aggregated status (accept 200/207)
          STATUS_CODE=$(curl -kfsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/status/?detailed=true")
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "207" ]]; then
            echo "Status check failed: $STATUS_CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
          fi
          # Service health (accept 200/207)
          for SVC in database cache mqtt; do
            CODE=$(curl -kfsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/health/$SVC/")
            if [[ "$CODE" != "200" && "$CODE" != "207" ]]; then
              echo "Health $SVC failed: $CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
            fi
          done
          # Metrics contains a known system metric
          curl -kfsS "$BASE_URL/monitoring/metrics/" | grep -q "system_cpu_usage_percent" || { echo "Metrics probe failed"; docker compose ps; docker compose logs nginx web || true; exit 1; }
          # Static asset served (admin CSS)
          STATIC_CODE=$(curl -kfsS -o /dev/null -w "%{http_code}" "$BASE_URL/static/admin/css/base.css")
          if [[ "$STATIC_CODE" != "200" ]]; then
            echo "Static probe failed: $STATIC_CODE"; docker compose ps; docker compose logs nginx web || true; exit 1
          fi

      - name: Wait for health (prod-webonly web:8000)
        if: matrix.mode == 'prod-webonly'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/monitoring/health/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Health check failed"; docker compose ps; docker compose logs web || true; exit 1

      - name: Probe endpoints (prod-webonly)
        if: matrix.mode == 'prod-webonly'
        run: |
          set -e
          BASE_URL="http://localhost:8000"
          # Aggregated status (accept 200/207)
          STATUS_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/status/?detailed=true")
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "207" ]]; then
            echo "Status check failed: $STATUS_CODE"; docker compose ps; docker compose logs web || true; exit 1
          fi
          # Service health (accept 200/207)
          for SVC in database cache mqtt; do
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/monitoring/health/$SVC/")
            if [[ "$CODE" != "200" && "$CODE" != "207" ]]; then
              echo "Health $SVC failed: $CODE"; docker compose ps; docker compose logs web || true; exit 1
            fi
          done
          # Metrics contains a known system metric
          curl -fsS "$BASE_URL/monitoring/metrics/" | grep -q "system_cpu_usage_percent" || { echo "Metrics probe failed"; docker compose ps; docker compose logs web || true; exit 1; }
          # Static asset served (admin CSS)
          STATIC_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE_URL/static/admin/css/base.css")
          if [[ "$STATIC_CODE" != "200" ]]; then
            echo "Static probe failed: $STATIC_CODE"; docker compose ps; docker compose logs web || true; exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose down -v || true


