name: Black Code Formatting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Permette di eseguire manualmente

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black
    
    - name: Run Black formatter
      id: black
      run: |
        # Controlla se ci sono file da formattare
        if black --check . --exclude "venv|node_modules|tests|cercollettiva/settings"; then
          echo "All files are already formatted."
          echo "formatted=false" >> $GITHUB_OUTPUT
        else
          echo "Files need formatting. Running Black..."
          black . --exclude "venv|node_modules|tests|cercollettiva/settings"
          echo "formatted=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Pull Request
      if: steps.black.outputs.formatted == 'true' && steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "style: Auto-format code with Black

        - Applied Black formatting to Python files
        - Excluded venv, node_modules, tests, and settings directories
        - Automated formatting via GitHub Actions"
        title: "🤖 Auto-format code with Black"
        body: |
          ## 🤖 Automatic Code Formatting
          
          This PR contains automatic code formatting changes applied by Black.
          
          ### Changes:
          - Applied Black code formatting to Python files
          - Excluded directories: `venv`, `node_modules`, `tests`, `cercollettiva/settings`
          - Ensures consistent code style across the project
          
          ### Files changed:
          See the diff below for all formatting changes.
          
          ---
          
          **Note**: This is an automated PR. Please review the changes and merge if they look correct.
        branch: auto-format/black-${{ github.run_number }}
        delete-branch: true
        labels: |
          automated
          formatting
          black
