name: Black Direct Formatting

on:
  workflow_dispatch:  # Solo esecuzione manuale per sicurezza
  push:
    branches: [ develop ]  # Solo su develop per sicurezza
    paths:
      - '**/*.py'  # Solo quando cambiano file Python

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black
    
    - name: Run Black formatter
      run: |
        echo "Running Black formatter..."
        black . --exclude "venv|node_modules|tests|cercollettiva/settings"
    
    - name: Check for changes
      id: changes
      run: |
        if git diff --quiet; then
          echo "No changes needed"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "Changes detected"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "style: Auto-format code with Black

        - Applied Black formatting to Python files
        - Excluded venv, node_modules, tests, and settings directories
        - Automated formatting via GitHub Actions"
    
    - name: Push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git push
